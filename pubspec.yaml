name: aim2025
description: "A modern instant messenger inspired by AIM."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.0.3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^16.2.5

  # UI & UX
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.2
  cached_network_image: ^3.3.1

  # Utilities
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0

  # Authentication
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # Ads
  google_mobile_ads: ^6.0.0

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  bubble: ^1.2.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  test: ^1.26.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
